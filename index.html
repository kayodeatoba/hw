<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Houston Wilderness Riverine Targeted Use of Buyouts (RTUBs) Web Dashboard</title>
<style id="app-css">
:root{--panel:#085e20;--panel2:#005214;--text:#ffffff;--muted:rgba(255,255,255,.72);--line:rgba(255,255,255,.18);--accent:#ffd34d;--font:"Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--panel);color:var(--text);font-family:var(--font);font-size:14px}
button,input,select,textarea{font:inherit}
#app{display:grid;height:100vh;grid-template-rows:auto auto 1fr auto;grid-template-columns:260px 1fr 220px;grid-template-areas:"head head head" "kpi kpi kpi" "list map legend" "tabs tabs tabs"}
header{grid-area:head;text-align:center;padding:10px 56px 8px;position:relative}
header h1{margin:0;font-size:19px;font-weight:700;line-height:1.25}
header p{margin:2px 0 0;font-size:14px;font-weight:600;color:var(--muted)}
#editBtn{position:absolute;right:10px;top:10px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
#kpis{grid-area:kpi;display:flex;gap:8px;flex-wrap:wrap;padding:0 10px 8px;justify-content:center}
#kpis:empty{display:none}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 14px;text-align:center;min-width:110px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
#list{grid-area:list;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
#list h2,#legend h2{font-size:14px;margin:10px 10px 8px}
#search{margin:0 10px 8px;padding:7px 10px;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:4px}
#search::placeholder{color:var(--muted)}
#items{flex:1;overflow:auto;margin:0;padding:0;list-style:none}
#items li{display:flex;align-items:center;gap:10px;padding:11px 10px;border-top:1px solid var(--line);cursor:pointer;border-left:4px solid transparent}
#items li:hover,#items li:focus{background:var(--panel2);outline:none}
#items li.on{border-left-color:var(--accent);background:var(--panel2)}
.sw{flex:none;width:18px;height:18px;border-radius:2px}
#hint{font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
#mapwrap{grid-area:map;position:relative;min-height:0}
#map{position:absolute;inset:0;background:#24372a}
#legend{grid-area:legend;overflow:auto;border-left:1px solid var(--line)}
.lg{padding:4px 10px 12px;border-bottom:1px solid var(--line)}
.lg label.t{display:flex;gap:8px;align-items:center;font-weight:600;margin:6px 0;cursor:pointer}
.lg .row{display:flex;gap:8px;align-items:center;margin:5px 0 5px 24px;font-size:13px}
.sym{flex:none;width:20px;height:14px;border-radius:2px}
.sym.line{height:6px;border-radius:3px}
.sym.pt{width:12px;height:12px;border-radius:50%}
#tabs{grid-area:tabs;display:flex;border-top:1px solid var(--line)}
#tabs button{background:transparent;border:0;color:var(--muted);padding:8px 14px;cursor:pointer;border-bottom:3px solid transparent}
#tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
#page2{grid-area:list / list / legend / legend;grid-column:1 / 4;grid-row:3;overflow:auto;padding:24px max(16px,8vw);display:none;line-height:1.55}
#page2 h2{margin-top:0}
#page2 a{color:var(--accent)}
#app.p2 #list,#app.p2 #mapwrap,#app.p2 #legend{visibility:hidden}
#app.p2 #page2{display:block}
#map .leaflet-popup-content-wrapper,#map .leaflet-popup-tip{background:var(--panel);color:var(--text);border-radius:6px}
#map .leaflet-popup-content{margin:10px 12px;min-width:240px}
#map.leaflet-container a.leaflet-popup-close-button{color:var(--text)}
#map .pp a{color:var(--accent)}
.pp h3{margin:0 0 8px;font-size:14px}
.pp table{border-collapse:separate;border-spacing:0 3px;width:100%}
.pp td{background:var(--panel2);padding:5px 8px;vertical-align:top}
.pp td:first-child{width:45%;color:var(--muted)}
.mapbtn{background:#fff;color:#222;width:30px;height:30px;line-height:30px;text-align:center;cursor:pointer;font-size:16px;display:block;text-decoration:none}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
/* editor */
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(420px,100vw);background:#fbfbf8;color:#1d2420;z-index:2000;overflow:auto;box-shadow:4px 0 24px rgba(0,0,0,.3);padding:14px 16px 40px;display:none;font-size:13px}
#drawer.open{display:block}
#drawer h3{font-size:15px;margin:18px 0 8px}
#drawer h4{margin:0;font-size:14px}
#drawer label{display:block;margin:8px 0 3px;font-weight:600}
#drawer input[type=text],#drawer select,#drawer textarea{width:100%;padding:6px 8px;border:1px solid #c9cec9;border-radius:4px;background:#fff;color:#1d2420}
#drawer textarea{min-height:110px}
#drawer .inl{display:flex;align-items:center;gap:6px;font-weight:400;margin:6px 0}
#drawer .btn{background:#0b5d22;color:#fff;border:0;border-radius:5px;padding:7px 12px;cursor:pointer;margin:4px 4px 4px 0}
#drawer .btn.ghost{background:#e6ebe6;color:#1d2420}
#drawer .card{border:1px solid #d9ddd8;border-radius:6px;padding:10px;margin:10px 0;background:#fff}
#drawer .cardh{display:flex;gap:6px;align-items:center}
#drawer .cardh input{flex:1}
#drawer .mini{border:1px solid #c9cec9;background:#fff;border-radius:4px;cursor:pointer;padding:3px 7px}
#drawer table{width:100%;border-collapse:collapse}
#drawer td{padding:2px 3px;vertical-align:middle}
#drawer td input[type=text]{padding:3px 6px}
#drawer .note{color:#5a635c;font-size:12px;margin:4px 0}
#drawer .drop{border:2px dashed #9bb3a0;border-radius:8px;padding:16px;text-align:center;color:#3d5543;cursor:pointer}
#drawer .drop.over{background:#e4f1e6}
#drawer .err{color:#a01818}
@media (max-width:820px){
 #app{height:auto;grid-template-columns:1fr;grid-template-rows:auto auto 60vh auto auto auto;grid-template-areas:"head" "kpi" "map" "list" "legend" "tabs"}
 #list{max-height:50vh;border-right:0}
 #legend{border-left:0}
 header{padding:10px 16px 8px;text-align:left}
 #page2{grid-column:1;grid-row:3 / 6}
 #editBtn{position:static;margin-top:6px}
}
</style>
</head>

function geomArea(g){if(!g)return 0;if(g.type==='Polygon')return polyArea(g.coordinates);if(g.type==='MultiPolygon')return g.coordinates.reduce(function(s,p){return s+polyArea(p)},0);return 0}
function geomKind(fc){for(var i=0;i<fc.features.length;i++){var g=fc.features[i].geometry;if(g){if(/Polygon/.test(g.type))return 'polygon';if(/Line/.test(g.type))return 'line';return 'point'}}return 'point'}
function roundCoords(x){if(typeof x[0]==='number')return x.map(function(v){return Math.round(v*1e6)/1e6});return x.map(roundCoords)}
function fieldsOf(fc){var s={};fc.features.slice(0,500).forEach(function(f){Object.keys(f.properties||{}).forEach(function(k){s[k]=1})});return Object.keys(s)}
function valuesOf(fc,field){var s={};fc.features.forEach(function(f){var v=(f.properties||{})[field];s[v==null?'':String(v)]=1});return Object.keys(s).sort()}
function fmt(v){if(v==null||v==='')return '';if(typeof v==='number'){return Math.abs(v)>=1000?v.toLocaleString(undefined,{maximumFractionDigits:1}):String(Math.round(v*1000)/1000)}var s=String(v);if(/^https?:\/\//.test(s))return '<a href="'+esc(s)+'" target="_blank" rel="noopener">'+esc(s)+'</a>';return esc(s)}

// ---------- layer config ----------
function newLayer(name,fc){
 fc.features=fc.features.filter(function(f){return f&&f.geometry});
 fc.features.forEach(function(f){f.geometry.coordinates=roundCoords(f.geometry.coordinates);f.properties=f.properties||{}});
 var kind=geomKind(fc),fields=fieldsOf(fc);
 var L={id:uid(),name:name,kind:kind,visible:true,data:fc,
  style:{mode:'single',color:CAT[layers.length%CAT.length],field:'',colors:{},outlineOnly:false,fillOpacity:0.45,weight:2.5},
  popup:{title:'',fields:fields.map(function(k){return{name:k,alias:k,show:!SYSTEM_FIELDS.test(k)}})},
  addArea:false,list:false};
 var nameField=fields.filter(function(k){return /name|site|title|label/i.test(k)})[0];
 if(nameField)L.popup.title=nameField;
 var statusField=fields.filter(function(k){return /status|category|type|class/i.test(k)})[0];
 if(statusField){var vals=valuesOf(fc,statusField);if(vals.length<=12){L.style.mode='category';L.style.field=statusField;vals.forEach(function(v,i){L.style.colors[v]=CAT[i%CAT.length]})}}
 return L;
}
function colorFor(L,f){if(L.style.mode==='category'){var v=(f.properties||{})[L.style.field];v=v==null?'':String(v);return L.style.colors[v]||'#888888'}return L.style.color}
function areaAcres(f){return geomArea(f.geometry)/4046.8564224}

// ---------- layout ----------
function buildShell(){
 document.documentElement.style.setProperty('--panel',cfg.panel);
 document.documentElement.style.setProperty('--panel2',cfg.panel2);
 document.documentElement.style.setProperty('--accent',cfg.accent);
 document.title=cfg.title;
 app.innerHTML='<header><h1 id="h1"></h1><p id="h2"></p>'+(EDIT?'<button id="editBtn" type="button">Edit dashboard</button>':'')+'</header>'+
 '<div id="kpis"></div>'+
 '<aside id="list"><h2 id="lt"></h2><input id="search" type="search" placeholder="Search…" aria-label="Search locations"><ul id="items"></ul><div id="hint"></div></aside>'+
 '<div id="mapwrap"><div id="map" role="region" aria-label="Map"></div></div>'+
 '<aside id="legend" aria-label="Legend and layers"></aside>'+
 '<section id="page2"></section>'+
 '<nav id="tabs"><button type="button" class="on" data-p="1"></button><button type="button" data-p="2"></button></nav>';
 document.getElementById('search').addEventListener('input',renderList);
 Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){b.addEventListener('click',function(){
  document.querySelectorAll('#tabs button').forEach(function(x){x.classList.toggle('on',x===b)});
  app.classList.toggle('p2',b.dataset.p==='2');if(b.dataset.p==='1'&&map)setTimeout(function(){map.invalidateSize()},50)})});
 if(EDIT){document.getElementById('editBtn').addEventListener('click',function(){drawer.classList.toggle('open');renderDrawer()})}
}
function renderText(){
 document.documentElement.style.setProperty('--panel',cfg.panel);
 document.documentElement.style.setProperty('--panel2',cfg.panel2);
 document.documentElement.style.setProperty('--accent',cfg.accent);
 document.title=cfg.title;
 document.getElementById('h1').textContent=cfg.title;
 document.getElementById('h2').textContent=cfg.subtitle;
 document.getElementById('lt').textContent=cfg.listTitle;
 document.getElementById('hint').textContent=cfg.listHint;
 var tb=document.querySelectorAll('#tabs button');tb[0].textContent=cfg.tab1;tb[1].textContent=cfg.tab2;
 tb[1].style.display=cfg.tab2Text.trim()?'':'none';
 var p=document.getElementById('page2');
 p.innerHTML='<h2>'+esc(cfg.tab2)+'</h2>'+cfg.tab2Text.split(/\n\s*\n/).map(function(par){
  return '<p>'+esc(par).replace(/\n/g,'<br>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')+'</p>'}).join('')+
  (cfg.source?'<h3>Data sources</h3><p>'+esc(cfg.source).replace(/\n/g,'<br>')+'</p>':'');
}

// ---------- map ----------
function initMap(){
 map=L.map('map',{zoomControl:false,preferCanvas:false}).setView([29.76,-95.37],10);
 L.control.zoom({position:'bottomright'}).addTo(map);
 L.control.scale({position:'bottomleft',imperial:true}).addTo(map);
 var Btn=L.Control.extend({options:{position:'topright'},onAdd:function(){var d=L.DomUtil.create('div','leaflet-bar');
  d.innerHTML='<a class="mapbtn" href="#" title="Zoom to all data" aria-label="Zoom to all data">&#8962;</a><a class="mapbtn" href="#" title="Show my location" aria-label="Show my location">&#9678;</a>';
  L.DomEvent.disableClickPropagation(d);
  d.children[0].onclick=function(e){e.preventDefault();home()};
  d.children[1].onclick=function(e){e.preventDefault();map.locate({setView:true,maxZoom:15})};return d}});
 new Btn().addTo(map);
 map.on('locationfound',function(e){L.circleMarker(e.latlng,{radius:7,color:'#fff',weight:2,fillColor:'#1a73e8',fillOpacity:1}).addTo(map)});
 map.on('baselayerchange',function(e){base=e.layer});
 setBasemap();
}
var baseCtl;
function setBasemap(){
 if(baseCtl)map.removeControl(baseCtl);
 var opts={},sel=null;
 Object.keys(BASEMAPS).forEach(function(k){var b=BASEMAPS[k];var t=L.tileLayer(b.url,{attribution:b.attr,maxNativeZoom:b.max,maxZoom:20,subdomains:'abcd'});opts[b.name]=t;if(k===cfg.basemap)sel=t});
 if(base)map.removeLayer(base);
 base=sel||opts[BASEMAPS['usgs-imagery-topo'].name];base.addTo(map);
 baseCtl=L.control.layers(opts,null,{position:'topright',collapsed:true}).addTo(map);
}
function popupHtml(Lc,f){
 var p=f.properties||{},rows='';
 Lc.popup.fields.forEach(function(fl){if(fl.show&&fl.name!==Lc.popup.title)rows+='<tr><td>'+esc(fl.alias||fl.name)+'</td><td>'+fmt(p[fl.name])+'</td></tr>'});
 if(Lc.addArea&&Lc.kind==='polygon')rows+='<tr><td>Area (acres, computed)</td><td>'+fmt(Math.round(areaAcres(f)*100)/100)+'</td></tr>';
 var t=Lc.popup.title?p[Lc.popup.title]:'';
 return '<div class="pp">'+(t!==''&&t!=null?'<h3>'+esc(t)+'</h3>':'<h3>'+esc(Lc.name)+'</h3>')+(rows?'<table>'+rows+'</table>':'')+'</div>';
}
function drawLayers(){
 Object.keys(leafletLayers).forEach(function(k){map.removeLayer(leafletLayers[k])});leafletLayers={};featureIndex=[];
 // draw bottom-up so the first layer in the list is on top
 layers.slice().reverse().forEach(function(Lc){
  var gl=L.geoJSON(Lc.data,{
   style:function(f){var c=colorFor(Lc,f);if(Lc.kind==='line')return{color:c,weight:Lc.style.weight*2,opacity:0.95,lineCap:'round'};
    return{color:c,weight:Lc.style.weight,fillColor:c,fillOpacity:Lc.style.outlineOnly?0:Lc.style.fillOpacity,opacity:1}},
   pointToLayer:function(f,ll){var c=colorFor(Lc,f);return L.circleMarker(ll,{radius:6,color:'#fff',weight:1.5,fillColor:c,fillOpacity:0.95})},
   onEachFeature:function(f,lyr){
    lyr.bindPopup(function(){return popupHtml(Lc,f)},{maxWidth:360});
    lyr.on('mouseover',function(){if(lyr.setStyle)lyr.setStyle({weight:(Lc.kind==='line'?Lc.style.weight*2:Lc.style.weight)+2})});
    lyr.on('mouseout',function(){gl.resetStyle(lyr)});
    if(Lc.list)featureIndex.push({Lc:Lc,f:f,lyr:lyr,name:String((f.properties||{})[Lc.popup.title]==null?'(no name)':(f.properties||{})[Lc.popup.title])});
   }});
  leafletLayers[Lc.id]=gl;if(Lc.visible)gl.addTo(map);
 });
}
function home(){var b=null;layers.forEach(function(Lc){if(map.hasLayer(leafletLayers[Lc.id])){var lb=leafletLayers[Lc.id].getBounds();if(lb.isValid())b=b?b.extend(lb):L.latLngBounds(lb.getSouthWest(),lb.getNorthEast())}});if(b)map.fitBounds(b,{padding:[20,20]})}

// ---------- list, legend, kpis ----------
function renderList(){
 var ul=document.getElementById('items'),q=document.getElementById('search').value.trim().toLowerCase();ul.innerHTML='';
 var items=featureIndex.slice();
 var shown=items.filter(function(it){return !q||it.name.toLowerCase().indexOf(q)>-1});
 if(!featureIndex.length){ul.innerHTML='<li style="cursor:default">'+(EDIT?'Add a layer and tick “Use for site list”.':'No locations.')+'</li>';return}
 shown.forEach(function(it){var li=document.createElement('li');li.tabIndex=0;li.setAttribute('role','button');
  li.innerHTML='<span class="sw" style="background:'+colorFor(it.Lc,it.f)+'"></span><span>'+esc(it.name)+'</span>';
  var go=function(){if(selectedLi)selectedLi.classList.remove('on');li.classList.add('on');selectedLi=li;
   var gl=leafletLayers[it.Lc.id];if(!map.hasLayer(gl)){gl.addTo(map);it.Lc.visible=true;renderLegend()}
   if(app.classList.contains('p2'))document.querySelector('#tabs button[data-p="1"]').click();
   if(it.lyr.getBounds){map.fitBounds(it.lyr.getBounds(),{maxZoom:17,padding:[30,30]})}else{map.setView(it.lyr.getLatLng(),16)}
   setTimeout(function(){it.lyr.openPopup()},350)};
  li.addEventListener('click',go);li.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
  ul.appendChild(li)});
 if(!shown.length)ul.innerHTML='<li style="cursor:default">No match.</li>';
}
function symHtml(Lc,c){var cls='sym'+(Lc.kind==='line'?' line':Lc.kind==='point'?' pt':'');
 var st=Lc.kind==='polygon'&&Lc.style.outlineOnly?'border:3px solid '+c+';background:transparent':'background:'+(Lc.kind==='polygon'?rgba(c,Math.max(.35,Lc.style.fillOpacity))+';border:2px solid '+c:c);
 return '<span class="'+cls+'" style="'+st+'"></span>'}
function renderLegend(){
 var el=document.getElementById('legend');el.innerHTML='<h2>Layers</h2>';
 if(!layers.length){el.innerHTML+='<p class="empty">No layers yet.</p>';return}
 layers.forEach(function(Lc){var d=document.createElement('div');d.className='lg';
  var h='<label class="t"><input type="checkbox" '+(Lc.visible?'checked':'')+'> '+esc(Lc.name)+'</label>';
  if(Lc.style.mode==='category'){h+='<div class="row" style="margin-left:24px;color:var(--muted)">'+esc(fieldAlias(Lc,Lc.style.field))+'</div>';
   Object.keys(Lc.style.colors).forEach(function(v){h+='<div class="row">'+symHtml(Lc,Lc.style.colors[v])+esc(v===''?'(blank)':v)+'</div>'})}
  else h+='<div class="row">'+symHtml(Lc,Lc.style.color)+'</div>';
  d.innerHTML=h;d.querySelector('input').addEventListener('change',function(e){Lc.visible=e.target.checked;var gl=leafletLayers[Lc.id];if(Lc.visible)gl.addTo(map);else map.removeLayer(gl)});
  el.appendChild(d)});
 if(cfg.source)el.innerHTML+='<div class="lg" style="font-size:12px;color:var(--muted)">Sources: '+esc(cfg.source)+'</div>';
}
function rgba(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')'}
function fieldAlias(Lc,n){var f=Lc.popup.fields.filter(function(x){return x.name===n})[0];return f?(f.alias||n):n}
function renderKpis(){
 var el=document.getElementById('kpis');el.innerHTML='';if(!cfg.showKpis)return;
 var Lc=layers.filter(function(l){return l.list})[0]||layers[0];if(!Lc)return;
 var k=[{v:Lc.data.features.length.toLocaleString(),t:Lc.name}];
 if(Lc.kind==='polygon'){var a=Lc.data.features.reduce(function(s,f){return s+areaAcres(f)},0);k.push({v:a.toLocaleString(undefined,{maximumFractionDigits:0}),t:'Total acres'})}
 if(Lc.style.mode==='category'){var c={};Lc.data.features.forEach(function(f){var v=String((f.properties||{})[Lc.style.field]||'');c[v]=(c[v]||0)+1});
  Object.keys(Lc.style.colors).forEach(function(v){k.push({v:c[v]||0,t:v||'(blank)',c:Lc.style.colors[v]})})}
 el.innerHTML=k.map(function(x){return '<div class="kpi"'+(x.c?' style="border-top:3px solid '+x.c+'"':'')+'><b>'+esc(x.v)+'</b><span>'+esc(x.t)+'</span></div>'}).join('');
}
function refresh(fit){renderText();drawLayers();renderList();renderLegend();renderKpis();setTimeout(function(){map.invalidateSize();if(fit)home()},30)}

// ---------- editor ----------
var drawer;
function setupEditor(){
 drawer=document.createElement('div');drawer.id='drawer';document.body.appendChild(drawer);
 drawer.addEventListener('dragover',function(e){e.preventDefault()});
}
function inp(label,key,type){var v=cfg[key];if(type==='area')return '<label>'+label+'</label><textarea data-k="'+key+'">'+esc(v)+'</textarea>';
 if(type==='color')return '<label class="inl"><input type="color" data-k="'+key+'" value="'+esc(v)+'"> '+label+'</label>';
 return '<label>'+label+'</label><input type="text" data-k="'+key+'" value="'+esc(v)+'">'}
function renderDrawer(){
 if(!drawer.classList.contains('open'))return;
 var h='<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Edit dashboard</h3><button class="mini" id="dclose" type="button">Close ✕</button></div>';
 h+='<h3>1. Add your data</h3><div class="drop" id="drop" tabindex="0">Drop files here or click to choose<br><span class="note">Zipped shapefile (.zip), loose .shp + .dbf + .prj (+ .cpg), or GeoJSON. One layer per file.</span></div><input type="file" id="file" multiple accept=".zip,.shp,.dbf,.prj,.cpg,.geojson,.json" hidden><div id="ferr" class="err"></div>';
 h+='<h3>2. Layers</h3>'+(layers.length?'<p class="note">The top layer draws on top. The site list uses the layer marked “Use for site list”.</p>':'<p class="note">No layers yet.</p>');
 layers.forEach(function(Lc,i){h+=layerCard(Lc,i)});
 h+='<h3>3. Title and text</h3>'+inp('Title','title')+inp('Subtitle','subtitle')+inp('Site list heading','listTitle')+inp('Hint under the list','listHint')+inp('First tab name','tab1')+inp('Second tab name','tab2')+inp('Second tab text (leave empty to hide the tab; blank line = new paragraph)','tab2Text','area')+inp('Data sources (shown in the legend and second tab)','source','area');
 h+='<h3>4. Look</h3><label>Basemap when the page opens</label><select data-k="basemap">'+Object.keys(BASEMAPS).map(function(k){return '<option value="'+k+'"'+(k===cfg.basemap?' selected':'')+'>'+esc(BASEMAPS[k].name)+'</option>'}).join('')+'</select>'+
  inp('Panel colour','panel','color')+inp('Pop-up row colour','panel2','color')+inp('Highlight colour','accent','color')+
  '<label class="inl"><input type="checkbox" data-k="showKpis" '+(cfg.showKpis?'checked':'')+'> Show summary numbers under the title (count, total acres, count per category)</label>';
 h+='<h3>5. Publish</h3><button class="btn" id="expEdit" type="button">Save editable copy (keep working)</button><button class="btn" id="exp" type="button">Download public dashboard (.html)</button><p class="note"><b>Editable copy</b> always opens with this edit panel: keep it for yourself and share it with the client. <b>Public dashboard</b> has no edit button: that is the one to host and embed.</p><button class="btn ghost" id="setview" type="button">Use current map view as start view</button>'+
  '<p class="note">The download is one self-contained file with your data inside. Upload it to any web host (GitHub Pages, Netlify, or the client’s site) and embed it with:</p>'+
  '<textarea readonly style="min-height:70px;font-family:monospace;font-size:12px">&lt;iframe src="https://YOUR-HOST/dashboard.html" title="'+esc(cfg.title)+'" width="100%" height="700" style="border:0" loading="lazy" allow="geolocation; fullscreen"&gt;&lt;/iframe&gt;</textarea>'+
  '<p class="note">Lost the editable copy? Open the public file with <b>#edit</b> at the end of its address to get the edit panel back. To work with the client, send them the file; they open it with #edit, make changes and send it back.</p>';
 drawer.innerHTML=h;wireDrawer();
}
function layerCard(Lc,i){
 var fields=Lc.popup.fields.map(function(f){return f.name});
 var h='<div class="card" data-i="'+i+'"><div class="cardh"><input type="text" data-l="name" value="'+esc(Lc.name)+'" aria-label="Layer name"><button class="mini" data-a="up" type="button" title="Move up">↑</button><button class="mini" data-a="down" type="button" title="Move down">↓</button><button class="mini" data-a="del" type="button" title="Remove layer">✕</button></div>';
 h+='<p class="note">'+Lc.data.features.length+' '+Lc.kind+' features</p>';
 h+='<label class="inl"><input type="checkbox" data-l="visible" '+(Lc.visible?'checked':'')+'> Visible when the page opens</label>';
 h+='<label class="inl"><input type="radio" name="listlayer" data-l="list" '+(Lc.list?'checked':'')+'> Use for site list</label>';
 h+='<label>Name field (pop-up title and site list)</label><select data-l="title"><option value="">(none)</option>'+fields.map(function(f){return '<option'+(f===Lc.popup.title?' selected':'')+'>'+esc(f)+'</option>'}).join('')+'</select>';
 h+='<label>Colour</label><select data-l="mode"><option value="">One colour</option>'+fields.map(function(f){return '<option value="'+esc(f)+'"'+(Lc.style.mode==='category'&&Lc.style.field===f?' selected':'')+'>By '+esc(f)+'</option>'}).join('')+'</select>';
 if(Lc.style.mode==='category'){h+='<table>'+Object.keys(Lc.style.colors).map(function(v){return '<tr><td style="width:40px"><input type="color" data-cv="'+esc(v)+'" value="'+Lc.style.colors[v]+'"></td><td>'+esc(v===''?'(blank)':v)+'</td></tr>'}).join('')+'</table>'}
 else h+='<label class="inl"><input type="color" data-l="color" value="'+Lc.style.color+'"> Colour</label>';
 if(Lc.kind==='polygon')h+='<label class="inl"><input type="checkbox" data-l="outlineOnly" '+(Lc.style.outlineOnly?'checked':'')+'> Outline only (no fill)</label><label class="inl">Fill opacity <input type="range" min="0" max="1" step="0.05" data-l="fillOpacity" value="'+Lc.style.fillOpacity+'"></label>';
 h+='<label class="inl">Line width <input type="range" min="0.5" max="6" step="0.5" data-l="weight" value="'+Lc.style.weight+'"></label>';
 if(Lc.kind==='polygon')h+='<label class="inl"><input type="checkbox" data-l="addArea" '+(Lc.addArea?'checked':'')+'> Add true area in acres to the pop-up (computed from the shape)</label>';
 h+='<details><summary style="cursor:pointer;margin-top:6px;font-weight:600">Pop-up fields</summary><p class="note">Untick to hide. Type a friendly name in the second box. ArcGIS system fields (FID, Shape__Area…) start hidden; Shape__Area from ArcGIS Online is Web Mercator area, not true area.</p><table>'+
  Lc.popup.fields.map(function(f,j){return '<tr><td style="width:24px"><input type="checkbox" data-pf="'+j+'" '+(f.show?'checked':'')+'></td><td style="width:42%;word-break:break-all">'+esc(f.name)+'</td><td><input type="text" data-pa="'+j+'" value="'+esc(f.alias)+'"></td></tr>'}).join('')+'</table></details>';
 return h+'</div>';
}
var redrawTimer;
function soon(fit){clearTimeout(redrawTimer);redrawTimer=setTimeout(function(){refresh(fit)},120)}
function wireDrawer(){
 drawer.querySelector('#dclose').onclick=function(){drawer.classList.remove('open')};
 var drop=drawer.querySelector('#drop'),file=drawer.querySelector('#file');
 drop.onclick=function(){file.click()};drop.onkeydown=function(e){if(e.key==='Enter')file.click()};
 file.onchange=function(){handleFiles(file.files)};
 drop.ondragover=function(e){e.preventDefault();drop.classList.add('over')};drop.ondragleave=function(){drop.classList.remove('over')};
 drop.ondrop=function(e){e.preventDefault();drop.classList.remove('over');handleFiles(e.dataTransfer.files)};
 drawer.querySelectorAll('[data-k]').forEach(function(el){el.addEventListener(el.type==='checkbox'||el.tagName==='SELECT'||el.type==='color'?'change':'input',function(){
  cfg[el.dataset.k]=el.type==='checkbox'?el.checked:el.value;
  if(el.dataset.k==='basemap')setBasemap();
  if(el.dataset.k==='showKpis')renderKpis();else renderText();
  if(el.dataset.k==='source')renderLegend()})});
 drawer.querySelectorAll('.card').forEach(function(card){var Lc=layers[+card.dataset.i];
  card.querySelectorAll('[data-a]').forEach(function(b){b.onclick=function(){var i=+card.dataset.i,a=b.dataset.a;
   if(a==='del'){if(!confirm('Remove layer “'+Lc.name+'”?'))return;layers.splice(i,1)}
   if(a==='up'&&i>0){layers.splice(i,1);layers.splice(i-1,0,Lc)}
   if(a==='down'&&i<layers.length-1){layers.splice(i,1);layers.splice(i+1,0,Lc)}
   refresh();renderDrawer()}});
  card.querySelectorAll('[data-l]').forEach(function(el){el.addEventListener(el.type==='text'?'input':'change',function(){var k=el.dataset.l,v=el.type==='checkbox'?el.checked:el.value;
   if(k==='title')Lc.popup.title=v;
   else if(k==='name'||k==='visible')Lc[k]=v;
   else if(k==='list'){layers.forEach(function(l){l.list=false});Lc.list=true}
   else if(k==='addArea')Lc.addArea=v;
   else if(k==='mode'){if(v){Lc.style.mode='category';Lc.style.field=v;var vals=valuesOf(Lc.data,v);if(vals.length>20){alert('That field has '+vals.length+' different values. Colouring by it works best with 20 or fewer.');}
     Lc.style.colors={};vals.slice(0,40).forEach(function(x,i){Lc.style.colors[x]=CAT[i%CAT.length]})}else Lc.style.mode='single';renderDrawer()}
   else if(k==='fillOpacity'||k==='weight')Lc.style[k]=+v;
   else Lc.style[k]=v;
   soon()})});
  card.querySelectorAll('[data-cv]').forEach(function(el){el.addEventListener('change',function(){Lc.style.colors[el.dataset.cv]=el.value;soon()})});
  card.querySelectorAll('[data-pf]').forEach(function(el){el.addEventListener('change',function(){Lc.popup.fields[+el.dataset.pf].show=el.checked})});
  card.querySelectorAll('[data-pa]').forEach(function(el){el.addEventListener('input',function(){Lc.popup.fields[+el.dataset.pa].alias=el.value;renderLegend()})});
 });
 drawer.querySelector('#exp').onclick=function(){exportHtml(false)};
 drawer.querySelector('#expEdit').onclick=function(){exportHtml(true)};
 drawer.querySelector('#setview').onclick=function(){var c=map.getCenter();cfg.view={lat:c.lat,lng:c.lng,z:map.getZoom()};this.textContent='Start view saved ✓'};
}
function readAs(f,kind){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;if(kind==='text')r.readAsText(f);else r.readAsArrayBuffer(f)})}
function baseName(n){return n.replace(/\.[^.]+$/,'')}
function handleFiles(list){
 var err=drawer.querySelector('#ferr');err.textContent='';
 var files=Array.prototype.slice.call(list),groups={},jobs=[];
 files.forEach(function(f){var ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='zip')jobs.push(readAs(f).then(function(b){return shp(b)}).then(function(r){return (Array.isArray(r)?r:[r]).map(function(fc){return newLayer(prettyName(fc.fileName||baseName(f.name)),fc)})}));
  else if(ext==='geojson'||ext==='json')jobs.push(readAs(f,'text').then(function(t){var g=JSON.parse(t);if(g.type==='Feature')g={type:'FeatureCollection',features:[g]};if(!g.features)throw new Error(f.name+' is not GeoJSON');return [newLayer(prettyName(baseName(f.name)),g)]}));
  else if(/^(shp|dbf|prj|cpg)$/.test(ext)){var b=baseName(f.name);(groups[b]=groups[b]||{})[ext]=f}
  else err.textContent+='Skipped '+f.name+' (unsupported type). ';
 });
 Object.keys(groups).forEach(function(b){var g=groups[b];if(!g.shp){err.textContent+=b+': the .shp file is missing. ';return}
  jobs.push(Promise.all([readAs(g.shp),g.dbf?readAs(g.dbf):null,g.prj?readAs(g.prj,'text'):null,g.cpg?readAs(g.cpg,'text'):null]).then(function(r){
   if(!r[2])err.textContent+=b+': no .prj, so coordinates are assumed to be longitude/latitude (WGS 84). ';
   var geoms=shp.parseShp(r[0],r[2]||undefined);var fc=r[1]?shp.combine([geoms,shp.parseDbf(r[1],r[3]||undefined)]):{type:'FeatureCollection',features:geoms.map(function(g){return{type:'Feature',geometry:g,properties:{}}})};
   return [newLayer(prettyName(b),fc)]}))});
 Promise.all(jobs.map(function(j){return j.catch(function(e){err.textContent+=(e&&e.message||e)+' ';return []})})).then(function(res){
  res.forEach(function(arr){(arr||[]).forEach(function(Lc){layers.push(Lc)})});
  if(!layers.some(function(l){return l.list})){var best=null;layers.forEach(function(l){if(l.popup.title&&l.kind!=='line'&&(!best||l.data.features.length>best.data.features.length))best=l});if(best)best.list=true}
  var bad=layers.filter(function(Lc){var b=L.geoJSON(Lc.data).getBounds();return b.isValid()&&(Math.abs(b.getNorth())>90||Math.abs(b.getEast())>180)});
  if(bad.length)err.textContent+='“'+bad[0].name+'” has coordinates outside longitude/latitude. Include its .prj file, or export it as GeoJSON (WGS 84). ';
  refresh(true);renderDrawer()});
}
function prettyName(n){n=String(n).split('/').pop();return n.replace(/[_]+/g,' ').replace(/\s+/g,' ').trim()}
function exportHtml(editable){
 var st={config:cfg,layers:layers};if(editable===true)st.editable=true;
 var json=JSON.stringify(st).replace(/</g,'\\u003c');
 var html='<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+esc(cfg.title)+'</title>\n<style id="app-css">'+document.getElementById('app-css').textContent+'</style>\n</head>\n<body>\n<div id="app"></div>\n<script type="application/json" id="dash-state">'+json+'<\/script>\n<script id="app-code">'+document.getElementById('app-code').textContent+'<\/script>\n</body>\n</html>\n';
 var blob=new Blob([html],{type:'text/html'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download=(editable===true?'EDITABLE-':'')+(cfg.title||'dashboard').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.html';document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}

// ---------- start ----------
buildShell();
var libs=[load('link',LEAFLET_CSS).catch(function(){}),load('script',LEAFLET_JS)];
if(EDIT)libs.push(load('script',SHP_JS));
Promise.all(libs).then(function(){
 initMap();
 if(EDIT){setupEditor();if(!layers.length){drawer.classList.add('open');renderDrawer()}}
 refresh(!cfg.view);
 if(cfg.view)map.setView([cfg.view.lat,cfg.view.lng],cfg.view.z);
}).catch(function(e){document.getElementById('mapwrap').innerHTML='<p class="empty">The map library could not load ('+esc(e.message)+'). Check the internet connection.</p>'});
})();
</script>
